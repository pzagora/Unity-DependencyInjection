# Copy to <package repo>/.github/workflows/publish.yml. Pushing a tag equal to package.json's version
# (e.g. `2.1.2`, or `v2.1.2`) publishes that version to the registry. Needs the UPM_PUBLISH_TOKEN repo secret.
name: Publish

on:
  push:
    tags: ['*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://upm.zagora.dev/

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Publish
        run: |
          rm -rf .github
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.UPM_PUBLISH_TOKEN }}
